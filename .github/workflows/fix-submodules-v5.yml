name: Fix and update submodules v5

on:
  workflow_dispatch:

jobs:
  fix-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Checkout submodule to custom-1.4.9 branch
        run: |
          cd libs/hbb_common
          git remote add custom https://github.com/cv0759/hbb_common.git
          git fetch custom
          git checkout custom/custom-1.4.9
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/hbb_common
          git commit -m "Update hbb_common to custom-1.4.9 branch"
          git push
