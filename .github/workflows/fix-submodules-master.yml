name: Fix and update submodules (master)

on:
  workflow_dispatch:

jobs:
  fix-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix .gitmodules and update submodules
        run: |
          # 用 git config 命令修改 .gitmodules，确保格式正确
          git config -f .gitmodules submodule.libs/hbb_common.url https://github.com/cv0759/hbb_common
          git config -f .gitmodules submodule.libs/hbb_common.branch custom-master
          
          # 初始化子模块
          git submodule init
          
          # 进入子模块目录
          cd libs/hbb_common
          
          # 添加我们自己的远程仓库
          git remote add custom https://github.com/cv0759/hbb_common.git
          
          # fetch 所有分支
          git fetch custom
          
          # checkout 到 custom-master 分支
          git checkout custom/custom-master
          
          # 回到主目录
          cd ../..
          
          # 配置 git 用户信息
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 提交修改
          git add libs/hbb_common
          git add .gitmodules
          git commit -m "Update hbb_common to custom-master branch"
          git push
          


