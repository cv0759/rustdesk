name: Update hbb_common to custom-full
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hbb_common submodule
        run: |
          cd libs/hbb_common
          git remote add custom https://github.com/cv0759/hbb_common.git
          git fetch custom custom-full
          git checkout custom/custom-full

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/hbb_common
          git commit -m "Update hbb_common to custom-full (with fixed password)"
          git push origin master
          


