name: Update hbb_common to custom-full-v3
on:
  workflow_dispatch:
jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Update hbb_common submodule
        run: |
          cd libs/hbb_common
          git remote add custom https://github.com/cv0759/hbb_common.git
          git fetch custom
          git checkout custom/custom-full-v3
          cd ../..
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/hbb_common
          git commit -m "Update hbb_common to custom-full-v3"
          git push origin master
          


